name: Run tests

on:
  pull_request:
  workflow_dispatch:

# Job timeouts: a normal run takes about 3 min (x86) and 1 min (ARMv7), almost all of the rest is apt. x86's 15 min
# covers the slow-mirror runs seen so far (14.5 min). A run that times out hit a stuck mirror: re-run it.

jobs:
  test-build-x86:
    name: Run tests (x86)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install GCC multilib
        run: |
          sudo apt-get update
          sudo apt-get install gcc-14 gcc-14-multilib g++-14-multilib
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
          } >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      # The Generator specs abort on signed overflow here (ADR 0004).
      - name: Configure
        run: cmake -B build -S tests -G Ninja -DGENERATOR_SPECS_SANITIZE=ON

      - name: Run build
        run: cmake --build build

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure --output-junit results/ctest_results.xml

      - name: Make results directory
        run: mkdir -p build/results

      - name: Run 32 bit CppUTest
        run: |
          cd build/results
          ../32bit_unit_tests/SmallPointerTests -ojunit
          ../32bit_unit_tests/MemoryManagerTests -ojunit
      - name: Run main CppUTest
        run: |
          cd build/results
          ../unit/UnitTests -ojunit

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results x86
          path: |
            build/results/**/*.xml
            build/spec/results/**/*.xml
            build/spec/results/*.xml

  test-build-qemu:
    name: Run tests for ARMv7 via QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install cross-compilation toolchain and QEMU
        run: |
          sudo debconf-communicate <<< "set man-db/auto-update false"
          sudo dpkg-reconfigure man-db        
          sudo apt-get update
          sudo apt-get install -y gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf qemu-user binfmt-support qemu-user-static
          {
            echo "CC=arm-linux-gnueabihf-gcc-14"
            echo "CXX=arm-linux-gnueabihf-g++-14"
            echo "LD_LIBRARY_PATH=/usr/arm-linux-gnueabihf/lib:$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      - name: Symlink ld-linux
        run: sudo ln -s /usr/arm-linux-gnueabihf/lib/ld-linux-armhf.so.3 /lib/ld-linux-armhf.so.3

      - name: Configure
        run: cmake -B build -S tests/qemu -G Ninja

      - name: Run build
        run: cmake --build build

      - name: Run CTest
        run: ctest --output-on-failure --test-dir build

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results ARMv7
          path: build/spec/results/**/*.xml

  generative-rules:
    name: Generative rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run the generative-rules hooks
        run: pipx run pre-commit run generative-rules --all-files
      # Stdlib only: the tests fake the Deluge, delugemu and gh.
      - name: Run the Python unit tests of scripts/generative
        run: python3 -m unittest discover -s scripts/generative -p 'test_*.py'

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}
